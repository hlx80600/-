# YOLO26 CasBot Action Multi-Head Regression Model
# Input: RGB (3ch) + pseudo-color depth (3ch) = 6 channels
# Output: XYZ continuous regression values (dx, dy, dz)
# Loss: SmoothL1 between predicted and annotated XYZ

# Parameters
nc: 3 # total output = num_heads(3) * classes_per_head(1) = 3 (dx, dy, dz)
ch: 6 # 6 channels for RGB (3ch) + pseudo-color depth (3ch)
model_family: casbot_action
action_variant: multiaction_regression
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 2, C2PSA, [1024]] # 9

# YOLO26n CasBot action multi-head regression head
# MultiActionHead args: [nc, num_heads, classes_per_head]
head:
  - [-1, 1, MultiActionHead, [nc, 3, 1]] # MultiActionHead with 3 heads, 1 regression output each (dx, dy, dz)
